const words=[['открыть','open','📖'],['закрыть','close','🚪'],['писать','write','✍️'],['смотреть','look','👀'],['слушать','listen','👂'],['читать','read','📚'],['петь','sing','🎤'],['рисовать','draw','🎨']];const commands=[['Встаньте!','Stand up!','🧍'],['Садитесь!','Sit down!','🪑'],['Хлопайте в ладоши!','Clap your hands!','👏'],['Топайте ногами!','Stamp your feet!','👣']];const all=[...words,...commands];let level=0,questions=[],index=0,points=0,locked=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function speak(s){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.78;speechSynthesis.speak(u)}
function start(l){level=l;index=0;points=0;locked=false;questions=l===2?shuffle([...words,...shuffle(words).slice(0,4)]):shuffle(all);document.querySelectorAll('.levels button').forEach((b,i)=>b.classList.toggle('active',i===l));render()}
function render(){document.getElementById('stage').textContent=['Переведи на английский','Угадай по картинке','Составь слово из букв','Напиши по-английски'][level];document.getElementById('score').textContent='⭐ '+points;document.getElementById('counter').textContent=index+' / 12';document.getElementById('fill').style.width=(index/12*100)+'%';if(index>=12){document.getElementById('game').innerHTML=`<div class="emoji">🏆</div><h2 class="center">Уровень пройден!</h2><p class="stars">${'⭐'.repeat(Math.max(1,Math.ceil(points/4)))}</p><p>Твой результат: <b>${points} из 12</b></p><div class="center"><button onclick="start(${level})">Повторить ↻</button> <button class="primary" onclick="start(${(level+1)%4})">Следующий уровень →</button></div>`;return}locked=false;let q=questions[index];let en=q[1],choices=shuffle([en,...shuffle(all.filter(x=>x[1]!==en)).slice(0,3).map(x=>x[1])]);let head=level===0?q[0]:level===1?q[2]:level===2?q[0]:q[0];let subtitle=level===1?'Выбери подходящее слово':level===2?'Нажимай на буквы по порядку, чтобы составить слово':'Как это будет по-английски?';let body=`<p>${subtitle}</p><div class="prompt">${head}</div><div class="center"><button onclick="speak(${JSON.stringify(en).replace(/"/g,'&quot;')})">🔊 Послушать</button></div>`;if(level===2){let letters=shuffle(en.split(''));window.letterAnswer='';body+=`<div class="center"><div class="built" id="built">_ _ _</div><div class="letterbox">${letters.map((ch,i)=>`<button class="letter" onclick="pickLetter(this,${i})">${ch.toUpperCase()}</button>`).join('')}</div><p><button onclick="undoLetter()">↩ Убрать букву</button> <button onclick="resetLetters()">↻ Сначала</button></p></div>`}else if(level===3){body+=`<div class="center" style="margin-top:20px"><input id="typed" autocomplete="off" placeholder="Type here"><p><button class="primary" onclick="checkText()">Проверить ✓</button></p></div>`}else{body+=`<div class="answers">${choices.map(c=>`<button data-answer="${c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="check(this)">${c}</button>`).join('')}</div>`}document.getElementById('game').innerHTML=body+`<div class="feedback" id="feedback"></div><div class="center hidden" id="next"><button class="primary" onclick="index++;render()">Дальше →</button></div>`;document.getElementById('counter').textContent=(index+1)+' / 12';if(level===3)document.getElementById('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){if(!locked)checkText();else{index++;render()}}})}
function pickLetter(btn,i){if(locked||btn.disabled)return;btn.disabled=true;btn.classList.add('chosen');window.letterAnswer+=btn.textContent.toLowerCase();document.getElementById('built').textContent=window.letterAnswer.toUpperCase().split('').join(' ');if(window.letterAnswer.length===questions[index][1].length)finish(window.letterAnswer===questions[index][1])}
function undoLetter(){if(locked)return;let selected=[...document.querySelectorAll('.letter.chosen')];let last=selected.pop();if(!last)return;last.disabled=false;last.classList.remove('chosen');window.letterAnswer=window.letterAnswer.slice(0,-1);document.getElementById('built').textContent=window.letterAnswer.toUpperCase().split('').join(' ')||'_ _ _'}
function resetLetters(){if(locked)return;window.letterAnswer='';document.querySelectorAll('.letter').forEach(b=>{b.disabled=false;b.classList.remove('chosen')});document.getElementById('built').textContent='_ _ _'}
function finish(ok){if(locked)return;locked=true;let q=questions[index];if(ok)points++;document.getElementById('score').textContent='⭐ '+points;document.getElementById('feedback').textContent=ok?'🎉 Отлично! Well done!':'💡 Правильный ответ: '+q[1];document.getElementById('next').classList.remove('hidden');if(ok)speak(q[1])}function check(btn){let ok=btn.dataset.answer===questions[index][1];btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('.answers button').forEach(b=>{b.disabled=true;if(b.dataset.answer===questions[index][1])b.classList.add('correct')});finish(ok)}function checkText(){let val=document.getElementById('typed').value.trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ');let answer=questions[index][1].toLowerCase().replace(/[.!?]+$/,'');document.getElementById('typed').disabled=true;finish(val===answer)}
</script></body></html>
